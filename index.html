<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Atividades por Setor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #ffffff; 
        }
        #info-setor {
            font-size: 11px;
            color: #333;
            margin-bottom: 2px;
            font-weight: bold;
        }
        .chart-container { 
            width: 100%; 
            max-width: 430px; 
            max-height: 310px;
            padding: 2px; 
        }
        canvas {
            max-height: 270px !important;
        }
    </style>
</head>
<body>

    <div id="info-setor">A carregar...</div>
    <div class="chart-container">
        <canvas id="meuGrafico"></canvas> 
    </div>

    <script>
        const TOKEN = '7IIBS4AieOeEcmfWNF35znNX7wqR6O5d'; 
        const TABLE_ID = '1004'; 
        const NOME_COLUNA_TIPO = 'Tipo'; 
        const NOME_COLUNA_SETOR = 'Setores'; 

        // Lê todos os parâmetros possíveis da URL
        const urlParams = new URLSearchParams(window.location.search);
        let setorFiltro = urlParams.get('setor') || urlParams.get('id') || urlParams.get('nome');

        // Se o parâmetro veio vazio ou com as chaves literais do Baserow
        if (!setorFiltro || setorFiltro.includes('{{') || setorFiltro.trim() === '') {
            setorFiltro = null;
        }

        if (setorFiltro) {
            document.getElementById('info-setor').innerText = `Setor Filtrado: ${setorFiltro}`;
        } else {
            document.getElementById('info-setor').innerText = `A mostrar todas as atividades (Sem filtro)`;
        }

        async function carregarDados() {
            const url = `http://baserow.app.local/api/database/rows/table/${TABLE_ID}/?user_field_names=true&size=200`;

            try {
                const resposta = await fetch(url, {
                    method: 'GET',
                    headers: { 'Authorization': `Token ${TOKEN}` }
                });
                
                const dados = await resposta.json();
                const atividades = dados.results;

                let contadores = {
                    'Intersetorial': 0,
                    'Setorial': 0,
                    'Grupo/Comissão': 0
                };

                let itensEncontrados = 0;

                atividades.forEach((atividade) => {
                    let setorAtividade = atividade[NOME_COLUNA_SETOR];

                    if (setorFiltro) {
                        let pertenceAoSetor = false;

                        if (Array.isArray(setorAtividade)) {
                            pertenceAoSetor = setorAtividade.some(s => {
                                if (typeof s === 'object' && s !== null) {
                                    let idItem = String(s.id || '').trim();
                                    let valItem = String(s.value || s.name || '').trim().toLowerCase();
                                    let filtroTrim = String(setorFiltro).trim().toLowerCase();
                                    
                                    return idItem === String(setorFiltro).trim() || valItem === filtroTrim;
                                }
                                return String(s).trim().toLowerCase() === String(setorFiltro).trim().toLowerCase();
                            });
                        } else if (setorAtividade !== null && setorAtividade !== undefined) {
                            let textoLookup = String(setorAtividade).trim().toLowerCase();
                            pertenceAoSetor = textoLookup.includes(String(setorFiltro).trim().toLowerCase());
                        }

                        if (!pertenceAoSetor) {
                            return; 
                        }
                    }

                    itensEncontrados++;

                    let campoBruto = atividade[NOME_COLUNA_TIPO];
                    let categoria = null;

                    if (typeof campoBruto === 'object' && campoBruto !== null) {
                        categoria = campoBruto.value || campoBruto.name;
                    } else {
                        categoria = campoBruto;
                    }
                    
                    if (categoria === 'Intersetorial') contadores['Intersetorial']++;
                    if (categoria === 'Setorial') contadores['Setorial']++;
                    if (categoria === 'Grupo/Comissão') contadores['Grupo/Comissão']++;
                });

                if (setorFiltro) {
                    document.getElementById('info-setor').innerText = `Setor: ${setorFiltro} (${itensEncontrados} atividades)`;
                } else {
                    document.getElementById('info-setor').innerText = `Todas as Atividades (${itensEncontrados} total)`;
                }

                desenharGrafico(contadores);

            } catch (erro) {
                console.error("Erro ao carregar dados do Baserow:", erro);
                document.getElementById('info-setor').innerText = "Erro ao carregar dados.";
            }
        }

        function desenharGrafico(contadores) {
            const ctx = document.getElementById('meuGrafico').getContext('2d');
            
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Intersetorial', 'Setorial', 'Grupos e Comissões'],
                    datasets: [{
                        label: 'Qtd',
                        data: [contadores['Intersetorial'], contadores['Setorial'], contadores['Grupo/Comissão']],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.7)', 
                            'rgba(54, 162, 235, 0.7)', 
                            'rgba(255, 206, 86, 0.7)'  
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: false }
                    }
                }
            });
        }

        carregarDados();
    </script>
</body>
</html>
