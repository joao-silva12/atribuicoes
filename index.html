<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Atividades por Setor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f5f7; }
        .chart-container { width: 80%; max-width: 600px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #debug-box { margin-top: 15px; width: 80%; max-width: 600px; background: #e2f0d9; padding: 10px; border: 1px solid #c8e1b7; font-size: 12px; border-radius: 5px; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="chart-container">
        <canvas id="meuGrafico"></canvas> 
    </div>
    
    <!-- Caixa de depuração para validação -->
    <div id="debug-box">A processar dados...</div>

    <script>
        const TOKEN = '7IIBS4AieOeEcmfWNF35znNX7wqR6O5d'; 
        const TABLE_ID = '1004'; 
        const NOME_COLUNA_TIPO = 'Tipo'; 
        const NOME_COLUNA_SETOR = 'Setores'; 

        const urlParams = new URLSearchParams(window.location.search);
        const setorFiltro = urlParams.get('setor');
        const debugBox = document.getElementById('debug-box');

        let logsDebug = `Filtro aplicado na URL: "${setorFiltro}"<br>`;

        async function carregarDados() {
            const url = `http://baserow.app.local/api/database/rows/table/${TABLE_ID}/?user_field_names=true&size=200`;

            try {
                const resposta = await fetch(url, {
                    method: 'GET',
                    headers: { 'Authorization': `Token ${TOKEN}` }
                });
                
                const dados = await resposta.json();
                const atividades = dados.results;

                let contadores = {
                    'Intersetorial': 0,
                    'Setorial': 0,
                    'Grupo/Comissão': 0
                };

                let totalFiltradas = 0;

                atividades.forEach((atividade) => {
                    let setorAtividade = atividade[NOME_COLUNA_SETOR];

                    // Se houver um filtro na URL, valida se o setor bate certo (por ID ou por Nome/Value)
                    if (setorFiltro) {
                        let pertenceAoSetor = false;

                        if (Array.isArray(setorAtividade)) {
                            pertenceAoSetor = setorAtividade.some(s => {
                                if (typeof s === 'object' && s !== null) {
                                    let idItem = String(s.id || '').trim();
                                    let valItem = String(s.value || s.name || '').trim().toLowerCase();
                                    let filtroTrim = String(setorFiltro).trim().toLowerCase();
                                    
                                    return idItem === String(setorFiltro).trim() || valItem === filtroTrim;
                                }
                                return String(s).trim().toLowerCase() === String(setorFiltro).trim().toLowerCase();
                            });
                        } else if (setorAtividade !== null && setorAtividade !== undefined) {
                            let textoLookup = String(setorAtividade).trim().toLowerCase();
                            pertenceAoSetor = textoLookup.includes(String(setorFiltro).trim().toLowerCase());
                        }

                        if (!pertenceAoSetor) {
                            return; // Ignora se não pertencer ao setor filtrado
                        }
                    }

                    totalFiltradas++;

                    // Processa a categoria da atividade
                    let campoBruto = atividade[NOME_COLUNA_TIPO];
                    let categoria = null;

                    if (typeof campoBruto === 'object' && campoBruto !== null) {
                        categoria = campoBruto.value || campoBruto.name;
                    } else {
                        categoria = campoBruto;
                    }
                    
                    if (categoria === 'Intersetorial') contadores['Intersetorial']++;
                    if (categoria === 'Setorial') contadores['Setorial']++;
                    if (categoria === 'Grupo/Comissão') contadores['Grupo/Comissão']++;
                });

                logsDebug += `Atividades encontradas após o filtro: ${totalFiltradas}`;
                debugBox.innerHTML = logsDebug;

                desenharGrafico(contadores, setorFiltro);

            } catch (erro) {
                console.error("Erro ao carregar dados do Baserow:", erro);
                debugBox.innerHTML = "Erro ao carregar dados: " + erro;
            }
        }

        function desenharGrafico(contadores, tituloSetor) {
            const ctx = document.getElementById('meuGrafico').getContext('2d');
            
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Intersetorial', 'Setorial', 'Grupos e Comissões'],
                    datasets: [{
                        label: 'Quantidade de Atividades',
                        data: [contadores['Intersetorial'], contadores['Setorial'], contadores['Grupo/Comissão']],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.7)', 
                            'rgba(54, 162, 235, 0.7)', 
                            'rgba(255, 206, 86, 0.7)'  
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: tituloSetor ? `Atividades do Setor: ${tituloSetor}` : 'Todas as Atividades'
                        }
                    }
                }
            });
        }

        carregarDados();
    </script>
</body>
</html>
