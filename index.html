<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Atividades por Setor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #ffffff; 
        }
        .chart-container { 
            width: 100%; 
            max-width: 430px; 
            max-height: 310px;
            padding: 2px; 
        }
        canvas {
            max-height: 270px !important;
        }
    </style>
</head>
<body>

    <div class="chart-container">
        <canvas id="meuGrafico"></canvas> 
    </div>

    <script>
        const TOKEN = '7IIBS4AieOeEcmfWNF35znNX7wqR6O5d'; 
        const TABLE_ID = '1004'; 
        const NOME_COLUNA_TIPO = 'Tipo'; 
        const NOME_COLUNA_SETOR = 'Setores'; 

        const urlParams = new URLSearchParams(window.location.search);
        let setorFiltro = urlParams.get('setor') || urlParams.get('id') || urlParams.get('nome');

        if (!setorFiltro || setorFiltro.includes('{{') || setorFiltro.trim() === '') {
            setorFiltro = null;
        }

        async function carregarDados() {
            const url = `http://baserow.app.local/api/database/rows/table/${TABLE_ID}/?user_field_names=true&size=200`;

            try {
                const resposta = await fetch(url, {
                    method: 'GET',
                    headers: { 'Authorization': `Token ${TOKEN}` }
                });
                
                const dados = await resposta.json();
                const atividades = dados.results;

                let contadores = {
                    'Intersetorial': 0,
                    'Setorial': 0,
                    'Grupo/Comissão': 0
                };

                atividades.forEach((atividade) => {
                    let setorAtividade = atividade[NOME_COLUNA_SETOR];
                    let pertenceAoSetor = false;

                    if (setorFiltro) {
                        if (Array.isArray(setorAtividade)) {
                            pertenceAoSetor = setorAtividade.some(s => {
                                if (typeof s === 'object' && s !== null) {
                                    let idItem = String(s.id || '').trim();
                                    let valItem = String(s.value || s.name || '').trim();
                                    let filtroTrim = String(setorFiltro).trim();
                                    
                                    return idItem === filtroTrim || valItem.toLowerCase() === filtroTrim.toLowerCase();
                                }
                                return String(s).trim().toLowerCase() === String(setorFiltro).trim().toLowerCase();
                            });
                        } else if (setorAtividade !== null && setorAtividade !== undefined) {
                            let textoLookup = String(setorAtividade).trim();
                            if (textoLookup.toLowerCase().includes(String(setorFiltro).trim().toLowerCase())) {
                                pertenceAoSetor = true;
                            }
                        }

                        if (!pertenceAoSetor) {
                            return; 
                        }
                    }

                    let campoBruto = atividade[NOME_COLUNA_TIPO];
                    let categoria = null;

                    if (typeof campoBruto === 'object' && campoBruto !== null) {
                        categoria = campoBruto.value || campoBruto.name;
                    } else {
                        categoria = campoBruto;
                    }
                    
                    if (categoria === 'Setorial') contadores['Setorial']++;
                    if (categoria === 'Intersetorial') contadores['Intersetorial']++;
                    if (categoria === 'Grupo/Comissão') contadores['Grupo/Comissão']++;
                });

                desenharGrafico(contadores);

            } catch (erro) {
                console.error("Erro ao carregar dados do Baserow:", erro);
            }
        }

        function desenharGrafico(contadores) {
            const ctx = document.getElementById('meuGrafico').getContext('2d');
            
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Setorial', 'Intersetorial', 'Grupos e Comissões'],
                    datasets: [{
                        label: 'Qtd',
                        data: [contadores['Setorial'], contadores['Intersetorial'], contadores['Grupo/Comissão']],
                        backgroundColor: [
                            'rgba(108, 51, 163, 0.7)', /* Roxo */
                            'rgba(23, 184, 166, 0.7)', /* Verde água */
                            'rgba(236, 72, 153, 0.7)'  /* Rosa */
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: false }
                    }
                }
            });
        }

        carregarDados();
    </script>
</body>
</html>
