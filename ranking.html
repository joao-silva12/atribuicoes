<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Preenchimento</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .funnel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 750px;
        }
        .funnel-header {
            font-size: 24px;
            font-weight: 900;
            color: #555;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .funnel-row {
            display: flex;
            align-items: stretch;
            justify-content: center;
            width: 100%;
            margin: 0;
        }
        .funnel-label-left {
            width: 180px;
            text-align: right;
            padding-right: 25px;
            font-weight: 800;
            font-size: 18px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            text-transform: uppercase;
        }
        .funnel-label-right {
            width: 180px;
            text-align: left;
            padding-left: 25px;
            font-size: 16px;
            color: #7f8c8d;
            display: flex;
            align-items: center;
        }
        .funnel-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 350px;
        }
        
        /* ESTILOS DA BARRA COM TOOLTIP */
        .funnel-bar {
            background-color: #17B8A6;
            color: white;
            font-weight: bold;
            font-size: 32px;
            text-align: center;
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 2;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        /* A CAIXA FLUTUANTE (TOOLTIP) */
        .funnel-bar .tooltip-texto {
            visibility: hidden;
            width: 160px;
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px 10px;
            position: absolute;
            z-index: 10;
            bottom: 110%;
            left: 50%;
            margin-left: -80px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 15px;
            font-weight: normal;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        .funnel-bar .tooltip-texto::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #2c3e50 transparent transparent transparent;
        }

        .funnel-bar:hover .tooltip-texto {
            visibility: visible;
            opacity: 1;
        }

        .funnel-connector {
            background-color: #A3E4D7;
            height: 40px;
            z-index: 1;
            position: relative;
            margin-top: -1px;
            margin-bottom: -1px;
        }
    </style>
</head>
<body>

    <div id="conteudo" style="color: #666; font-size: 16px; font-weight:bold;">A iniciar o Funil...</div>

    <script>
        const TOKEN = '7IIBS4AieOeEcmfWNF35znNX7wqR6O5d';
        const TABLE_ID = '1004';
        
        // Nome exato da coluna atualizado conforme pedido:
        const COLUNA_NOME_SETOR = 'setor-corespo'; 

        function extrairValor(val) {
            if (Array.isArray(val)) {
                if (val.length === 0) return 0;
                return val[0].value !== undefined ? val[0].value : (val[0].name !== undefined ? val[0].name : val[0]);
            }
            if (val !== null && typeof val === 'object') {
                return val.value !== undefined ? val.value : (val.name !== undefined ? val.name : 0);
            }
            return val;
        }

        async function carregarRanking() {
            const container = document.getElementById('conteudo');
            const url = `http://baserow.app.local/api/database/rows/table/${TABLE_ID}/?user_field_names=true&size=200`;

            try {
                container.innerHTML = "A comunicar com a API...";
                
                const resposta = await fetch(url, {
                    method: 'GET',
                    headers: { 'Authorization': `Token ${TOKEN}` }
                });
                
                if (!resposta.ok) throw new Error(`Erro de Ligação: ${resposta.status}`);

                const dados = await resposta.json();
                const atribuicoes = dados.results;

                if (!atribuicoes || atribuicoes.length === 0) {
                    container.innerHTML = `Sem dados.`;
                    return;
                }

                let setoresMap = {};

                atribuicoes.forEach((atribuicao) => {
                    if (!atribuicao) return;
                    
                    let chaves = Object.keys(atribuicao);
                    let chaveCategoria = chaves.find(k => k.toLowerCase().includes('atividade setorial')) || 'Atividade Setorial';
                    let chaveStatus = chaves.find(k => k.toLowerCase().includes('completa')) || 'Atividade completa';
                    
                    let chaveSetor = chaves.find(k => k.toLowerCase() === COLUNA_NOME_SETOR.toLowerCase()) || COLUNA_NOME_SETOR;

                    let ehSetorial = Number(extrairValor(atribuicao[chaveCategoria])) || 0;
                    if (ehSetorial !== 1) return;

                    let valSetor = atribuicao[chaveSetor];
                    let nomeSetor = "Sem Setor";

                    if (valSetor !== undefined && valSetor !== null) {
                        if (Array.isArray(valSetor) && valSetor.length > 0) {
                            nomeSetor = valSetor[0].value || valSetor[0].name || String(valSetor[0]);
                        } else if (!Array.isArray(valSetor)) {
                            nomeSetor = String(valSetor);
                        }
                    }

                    if (nomeSetor === "Sem Setor" || nomeSetor === "0") {
                        return;
                    }

                    if (!setoresMap[nomeSetor]) {
                        setoresMap[nomeSetor] = { soma: 0, total: 0 };
                    }

                    let statusConclusao = Number(extrairValor(atribuicao[chaveStatus])) || 0;
                    setoresMap[nomeSetor].soma += statusConclusao; 
                    setoresMap[nomeSetor].total++; 
                });

                let rankingArray = Object.keys(setoresMap).map(nome => {
                    let info = setoresMap[nome];
                    let media = info.total > 0 ? (info.soma / info.total) * 100 : 0;
                    return { 
                        nome: nome, 
                        percentagem: Math.round(media), 
                        total: info.total,
                        completas: info.soma 
                    };
                });

                rankingArray.sort((a, b) => b.percentagem - a.percentagem);

                if (rankingArray.length === 0) {
                    container.innerHTML = `Nenhum setor encontrado com atribuições válidas.`;
                    return;
                }

                let top5 = rankingArray.slice(0, 5);
                let widths = [100, 85, 70, 55, 40]; 
                
                let html = `<div class="funnel-container">
                              <div class="funnel-header">TOP 5 - RANKING DE PREENCHIMENTO SETORIAL</div>`;
                
                top5.forEach((item, index) => {
                    let w = widths[index];
                    let nextW = widths[index + 1] || (w - 15);
                    
                    let pTopLeft = 50 - (w / 2);
                    let pTopRight = 50 + (w / 2);
                    let pBotRight = 50 + (nextW / 2);
                    let pBotLeft = 50 - (nextW / 2);
                    
                    let connectorHtml = '';
                    if (index < top5.length - 1) { 
                        connectorHtml = `<div class="funnel-connector" style="clip-path: polygon(${pTopLeft}% 0, ${pTopRight}% 0, ${pBotRight}% 100%, ${pBotLeft}% 100%); width: 100%;"></div>`;
                    }

                    html += `
                    <div class="funnel-row">
                        <div class="funnel-label-left">${item.nome}</div>
                        <div class="funnel-center">
                            <div class="funnel-bar" style="width: ${w}%;">
                                ${item.percentagem}%
                                <span class="tooltip-texto">Concluídas: ${item.completas}/${item.total}</span>
                            </div>
                            ${connectorHtml}
                        </div>
                        <div class="funnel-label-right">${item.total} atribuições</div>
                    </div>
                    `;
                });

                html += `</div>`;
                
                document.getElementById('conteudo').innerHTML = html;

            } catch (erro) {
                document.getElementById('conteudo').innerHTML = `<div style="color:red; font-size:16px;">Erro: ${erro.message}</div>`;
            }
        }

        carregarRanking();
    </script>
</body>
</html>
