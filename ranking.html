<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Preenchimento</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .funnel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 750px;
        }
        .funnel-header {
            font-size: 24px;
            font-weight: 900;
            color: #555;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .funnel-row {
            display: flex;
            align-items: stretch;
            justify-content: center;
            width: 100%;
            margin: 0;
        }
        .funnel-label-left {
            width: 180px;
            text-align: right;
            padding-right: 25px;
            font-weight: 800;
            font-size: 18px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            text-transform: uppercase;
        }
        .funnel-label-right {
            width: 180px;
            text-align: left;
            padding-left: 25px;
            font-size: 16px;
            color: #7f8c8d;
            display: flex;
            align-items: center;
        }
        .funnel-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 350px;
        }
        
        /* ESTILOS DA BARRA COM TOOLTIP */
        .funnel-bar {
            background-color: #17B8A6;
            color: white;
            font-weight: bold;
            font-size: 32px;
            text-align: center;
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 2;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer; /* Muda o rato para a mãozinha ao passar por cima */
        }
        
        /* A CAIXA FLUTUANTE (TOOLTIP) */
        .funnel-bar .tooltip-texto {
            visibility: hidden;
            width: 160px;
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px 10px;
            position: absolute;
            z-index: 10;
            bottom: 110%; /* Fica mesmo por cima da barra */
            left: 50%;
            margin-left: -80px; /* Centra a caixa */
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 15px;
            font-weight: normal;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            pointer-events: none; /* Para não atrapalhar o clique/rato */
        }

        /* A SETINHA PARA BAIXO DO TOOLTIP */
        .funnel-bar .tooltip-texto::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #2c3e50 transparent transparent transparent;
        }

        /* EFEITO QUANDO PASSA O RATO */
        .funnel-bar:hover .tooltip-texto {
            visibility: visible;
            opacity: 1;
        }

        .funnel-connector {
            background-color: #A3E4D7;
            height: 40px;
            z-index: 1;
            position: relative;
            margin-top: -1px;
            margin-bottom: -1px;
        }
    </style>
</head>
<body>

    <div id="conteudo" style="color: #666; font-size: 16px; font-weight:bold;">A iniciar o Funil...</div>

    <script>
        const TOKEN = '7IIBS4AieOeEcmfWNF35znNX7wqR6O5d';

                return val[0].value !== undefined ? val[0].value : (val[0].name !== undefined ? val[0].name : val[0]);
            }
            if (val !== null && typeof val === 'object') {
                return val.value !== undefined ? val.value : (val.name !== undefined ? val.name : 0);
            }
            return val;
        }
