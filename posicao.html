<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição do Setor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        .setor-nome {
            font-size: 15px;
            font-weight: 800;
            color: #333;
            text-transform: uppercase;
        }
        .posicao-numero {
            font-weight: bold;
            color: #17B8A6;
        }
        .mini-bar {
            background-color: #17B8A6;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            padding: 8px 15px;
            border-radius: 4px;
        }
        .debug-msg {
            font-size: 12px;
            color: #e74c3c;
            background: #fadbd8;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="conteudo" style="width: 100%; display: flex; justify-content: center;">
        <span style="font-size: 12px; color: #888;">A aguardar parâmetros...</span>
    </div>

    <script>
        const TOKEN = '7IIBS4AieOeEcmfWNF35znNX7wqR6O5d';
        const TABLE_ID = '1004';
        const COLUNA_NOME_SETOR = 'setor-corespo'; 

        const urlParams = new URLSearchParams(window.location.search);
        let setorFiltro = urlParams.get('setor') || urlParams.get('id') || urlParams.get('nome');

        // Se quiser testar direto no browser para ver se funciona, remova temporariamente esta linha de verificação
        if (!setorFiltro || setorFiltro.includes('{{') || setorFiltro.trim() === '') {
            setorFiltro = null;
        }

        function extrairValor(val) {
            if (Array.isArray(val)) {
                if (val.length === 0) return 0;
                return val[0].value !== undefined ? val[0].value : (val[0].name !== undefined ? val[0].name : val[0]);
            }
            if (val !== null && typeof val === 'object') {
                return val.value !== undefined ? val.value : (val.name !== undefined ? val.name : 0);
            }
            return val;
        }

        async function carregarSetorIndividual() {
            const container = document.getElementById('conteudo');

            if (!setorFiltro) {
                container.innerHTML = `<div class="debug-msg">Aviso: Nenhum setor passado na URL. (Teste abrir no browser com ?setor=NOME)</div>`;
                return;
            }

            try {
                container.innerHTML = `<span style="font-size: 12px; color: #666;">A carregar dados para "${setorFiltro}"...</span>`;
                
                const url = `http://baserow.app.local/api/database/rows/table/${TABLE_ID}/?user_field_names=true&size=200`;
                
                const resposta = await fetch(url, {
                    method: 'GET',
                    headers: { 'Authorization': `Token ${TOKEN}` }
                });
                
                if (!resposta.ok) throw new Error(`Erro de Ligação: ${resposta.status}`);

                const dados = await resposta.json();
                const atribuicoes = dados.results;

                if (!atribuicoes || atribuicoes.length === 0) {
                    container.innerHTML = `<div class="debug-msg">Tabela vazia.</div>`;
                    return;
                }

                let setoresMap = {};

                atribuicoes.forEach((atribuicao) => {
                    if (!atribuicao) return;
                    
                    let chaves = Object.keys(atribuicao);
                    let chaveCategoria = chaves.find(k => k.toLowerCase().includes('atividade setorial')) || 'Atividade Setorial';
                    let chaveStatus = chaves.find(k => k.toLowerCase().includes('completa')) || 'Atividade completa';
                    let chaveSetor = chaves.find(k => k.toLowerCase() === COLUNA_NOME_SETOR.toLowerCase()) || COLUNA_NOME_SETOR;

                    let ehSetorial = Number(extrairValor(atribuicao[chaveCategoria])) || 0;
                    if (ehSetorial !== 1) return;

                    let valSetor = atribuicao[chaveSetor];
                    let nomeSetor = "Sem Setor";

                    if (valSetor !== undefined && valSetor !== null) {
                        if (Array.isArray(valSetor) && valSetor.length > 0) {
                            nomeSetor = valSetor[0].value || valSetor[0].name || String(valSetor[0]);
                        } else if (!Array.isArray(valSetor)) {
                            nomeSetor = String(valSetor);
                        }
                    }

                    if (nomeSetor === "Sem Setor" || nomeSetor === "0") return;

                    if (!setoresMap[nomeSetor]) {
                        setoresMap[nomeSetor] = { soma: 0, total: 0 };
                    }

                    let statusConclusao = Number(extrairValor(atribuicao[chaveStatus])) || 0;
                    setoresMap[nomeSetor].soma += statusConclusao; 
                    setoresMap[nomeSetor].total++; 
                });

                let rankingArray = Object.keys(setoresMap).map(nome => {
                    let info = setoresMap[nome];
                    let media = info.total > 0 ? (info.soma / info.total) * 100 : 0;
                    return { 
                        nome: nome, 
                        percentagem: Math.round(media), 
                        total: info.total,
                        completas: info.soma 
                    };
                });

                rankingArray.sort((a, b) => b.percentagem - a.percentagem);

                let index = rankingArray.findIndex(s => s.nome.toLowerCase() === setorFiltro.toLowerCase() || s.nome.toLowerCase().includes(setorFiltro.toLowerCase()));
                
                if (index === -1) {
                    container.innerHTML = `<div class="debug-msg">Setor "${setorFiltro}" não encontrado nos dados.</div>`;
                    return;
                }

                let setorInfo = rankingArray[index];
                let posicaoOrdinal = `${index + 1}º`;

                container.innerHTML = `
                    <div class="card-container">
                        <div style="display: flex; flex-direction: column;">
                            <div class="setor-nome">${setorInfo.nome}</div>
                            <div style="font-size: 12px; color: #7f8c8d;">Posição: <span class="posicao-numero">${posicaoOrdinal}</span></div>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: flex-end;">
                            <div class="mini-bar">${setorInfo.percentagem}%</div>
                            <div style="font-size: 11px; color: #95a5a6; margin-top: 3px;">${setorInfo.total} atribuições</div>
                        </div>
                    </div>
                `;

            } catch (erro) {
                container.innerHTML = `<div class="debug-msg">Erro: ${erro.message}</div>`;
            }
        }

        carregarSetorIndividual();
    </script>
</body>
</html>
