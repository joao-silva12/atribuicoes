<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição do Setor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 12px;
            padding: 20px 28px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        .card-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .setor-nome {
            font-size: 19px;
            font-weight: 800;
            color: #2c3e50;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .posicao-texto {
            font-size: 15px;
            color: #7f8c8d;
        }
        .posicao-numero {
            font-weight: bold;
            color: #17B8A6;
            font-size: 16px;
        }
        .card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .mini-bar {
            background-color: #17B8A6;
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            padding: 12px 22px;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            min-width: 80px;
            box-shadow: inset 0px -3px 0px rgba(0,0,0,0.15);
        }
        .mini-bar .tooltip-texto {
            visibility: hidden;
            width: 190px;
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px 12px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            margin-left: -95px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 15px;
            font-weight: normal;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            pointer-events: none;
        }
        .mini-bar .tooltip-texto::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #2c3e50 transparent transparent transparent;
        }
        .mini-bar:hover .tooltip-texto {
            visibility: visible;
            opacity: 1;
        }
        .total-atribuicoes {
            font-size: 14px;
            color: #95a5a6;
            margin-top: 6px;
            font-weight: 500;
        }
        .aviso-vazio {
            font-size: 15px;
            color: #7f8c8d;
            background: #f8f9fa;
            border: 1px solid #dcdfe6;
            padding: 20px 28px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 520px;
            font-weight: bold;
            box-sizing: border-box;
            box-shadow: 0 6px 14px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body>

    <div id="conteudo" style="width: 100%; display: flex; justify-content: center;"></div>

    <script>
        const TOKEN = '7IIBS4AieOeEcmfWNF35znNX7wqR6O5d';
        const TABLE_ID = '1004';
        const COLUNA_NOME_SETOR = 'setor-corespo'; 

        const urlParams = new URLSearchParams(window.location.search);
        let setorFiltro = urlParams.get('setor') || urlParams.get('id') || urlParams.get('nome');

        if (!setorFiltro || setorFiltro.includes('{{') || setorFiltro.trim() === '') {
            setorFiltro = null;
        } else {
            setorFiltro = setorFiltro.trim();
        }

        function extrairValor(val) {
            if (Array.isArray(val)) {
                if (val.length === 0) return 0;
                return val[0].value !== undefined ? val[0].value : (val[0].name !== undefined ? val[0].name : val[0]);
            }
            if (val !== null && typeof val === 'object') {
                return val.value !== undefined ? val.value : (val.name !== undefined ? val.name : 0);
            }
            return val;
        }

        function analisarSetor(valSetor) {
            let nomeSetor = "Sem Setor";
            let idSetor = null;

            if (valSetor !== undefined && valSetor !== null) {
                if (Array.isArray(valSetor) && valSetor.length > 0) {
                    nomeSetor = String(valSetor[0].value || valSetor[0].name || valSetor[0]);
                    idSetor = valSetor[0].id !== undefined ? String(valSetor[0].id) : null;
                } else if (typeof valSetor === 'object') {
                    nomeSetor = String(valSetor.value || valSetor.name || valSetor);
                    idSetor = valSetor.id !== undefined ? String(valSetor.id) : null;
                } else {
                    nomeSetor = String(valSetor);
                }
            }
            return { nome: nomeSetor, id: idSetor };
        }

        async function carregarSetorIndividual() {
            const container = document.getElementById('conteudo');

            if (!setorFiltro) {
                container.innerHTML = `<div class="aviso-vazio">Nenhum setor especificado na URL</div>`;
                return;
            }

            try {
                const url = `http://baserow.app.local/api/database/rows/table/${TABLE_ID}/?user_field_names=true&size=200`;
                
                const resposta = await fetch(url, {
                    method: 'GET',
                    headers: { 'Authorization': `Token ${TOKEN}` }
                });
                
                if (!resposta.ok) throw new Error(`Erro de Ligação: ${resposta.status}`);

                const dados = await resposta.json();
                const atribuicoes = dados.results;

                if (!atribuicoes || atribuicoes.length === 0) {
                    container.innerHTML = `<div class="aviso-vazio">Sem dados na tabela</div>`;
                    return;
                }

                let nomeSetorAlvoReal = null;
                let setoresMap = {};

                // Passo 1: Encontrar exatamente qual é o nome do setor associado ao ID ou valor passado na URL
                atribuicoes.forEach((atribuicao) => {
                    if (!atribuicao) return;
                    let chaves = Object.keys(atribuicao);
                    let chaveSetor = chaves.find(k => k.toLowerCase() === COLUNA_NOME_SETOR.toLowerCase()) || COLUNA_NOME_SETOR;
                    
                    let info = analisarSetor(atribuicao[chaveSetor]);
                    if (info.nome === "Sem Setor" || info.nome === "0") return;

                    // Verifica se o ID bate certo OU se o nome/texto bate certo
                    if (info.id === setorFiltro || info.nome.toLowerCase() === setorFiltro.toLowerCase() || info.nome.toLowerCase().includes(setorFiltro.toLowerCase())) {
                        nomeSetorAlvoReal = info.nome;
                    }
                });

                // Passo 2: Construir o ranking geral completo
                atribuicoes.forEach((atribuicao) => {
                    if (!atribuicao) return;
                    
                    let chaves = Object.keys(atribuicao);
                    let chaveCategoria = chaves.find(k => k.toLowerCase().includes('atividade setorial')) || 'Atividade Setorial';
                    let chaveStatus = chaves.find(k => k.toLowerCase().includes('completa')) || 'Atividade completa';
                    let chaveSetor = chaves.find(k => k.toLowerCase() === COLUNA_NOME_SETOR.toLowerCase()) || COLUNA_NOME_SETOR;

                    let info = analisarSetor(atribuicao[chaveSetor]);
                    if (info.nome === "Sem Setor" || info.nome === "0") return;

                    if (!setoresMap[info.nome]) {
                        setoresMap[info.nome] = { soma: 0, total: 0 };
                    }

                    let ehSetorial = Number(extrairValor(atribuicao[chaveCategoria])) || 0;
                    if (ehSetorial !== 1) return;

                    let statusConclusao = Number(extrairValor(atribuicao[chaveStatus])) || 0;
                    setoresMap[info.nome].soma += statusConclusao; 
                    setoresMap[info.nome].total++; 
                });

                let rankingArray = Object.keys(setoresMap).map(nome => {
                    let info = setoresMap[nome];
                    let media = info.total > 0 ? (info.soma / info.total) * 100 : 0;
                    return { 
                        nome: nome, 
                        percentagem: Math.round(media), 
                        total: info.total,
                        completas: info.soma 
                    };
                });

                rankingArray.sort((a, b) => b.percentagem - a.percentagem);

                if (!nomeSetorAlvoReal) {
                    container.innerHTML = `<div class="aviso-vazio">Setor não encontrado para o parâmetro: ${setorFiltro}</div>`;
                    return;
                }

                // Encontra a posição exata deste setor no ranking ordenado
                let index = rankingArray.findIndex(s => s.nome.toLowerCase() === nomeSetorAlvoReal.toLowerCase());
                
                if (index === -1) {
                    // Se o setor existe mas tem 0 atividades setoriais contabilizadas no ranking
                    container.innerHTML = `
                        <div class="card-container">
                            <div class="card-left">
                                <div class="setor-nome">${nomeSetorAlvoReal}</div>
                                <div class="posicao-texto">Posição no ranking: <span class="posicao-numero">-</span></div>
                            </div>
                            <div class="card-right">
                                <div class="mini-bar">
                                    0%
                                    <span class="tooltip-texto">Concluídas: 0/0</span>
                                </div>
                                <div class="total-atribuicoes">0 atribuições</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                let setorInfo = rankingArray[index];
                let posicaoOrdinal = `${index + 1}º`;

                container.innerHTML = `
                    <div class="card-container">
                        <div class="card-left">
                            <div class="setor-nome">${setorInfo.nome}</div>
                            <div class="posicao-texto">Posição no ranking: <span class="posicao-numero">${posicaoOrdinal}</span></div>
                        </div>
                        <div class="card-right">
                            <div class="mini-bar">
                                ${setorInfo.percentagem}%
                                <span class="tooltip-texto">Concluídas: ${setorInfo.completas}/${setorInfo.total}</span>
                            </div>
                            <div class="total-atribuicoes">${setorInfo.total} atribuições</div>
                        </div>
                    </div>
                `;

            } catch (erro) {
                container.innerHTML = `<div class="aviso-vazio">Erro ao carregar dados</div>`;
            }
        }

        carregarSetorIndividual();
    </script>
</body>
</html>
