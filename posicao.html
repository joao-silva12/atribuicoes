<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição do Setor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 10px;
            padding: 16px 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        .card-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .setor-nome {
            font-size: 17px;
            font-weight: 800;
            color: #2c3e50;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .posicao-texto {
            font-size: 13px;
            color: #7f8c8d;
        }
        .posicao-numero {
            font-weight: bold;
            color: #17B8A6;
            font-size: 14px;
        }
        .card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .mini-bar {
            background-color: #17B8A6;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            padding: 10px 18px;
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            min-width: 70px;
            box-shadow: inset 0px -2px 0px rgba(0,0,0,0.15);
        }
        .mini-bar .tooltip-texto {
            visibility: hidden;
            width: 170px;
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px 10px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            margin-left: -85px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
            font-weight: normal;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            pointer-events: none;
        }
        .mini-bar .tooltip-texto::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #2c3e50 transparent transparent transparent;
        }
        .mini-bar:hover .tooltip-texto {
            visibility: visible;
            opacity: 1;
        }
        .total-atribuicoes {
            font-size: 12px;
            color: #95a5a6;
            margin-top: 5px;
            font-weight: 500;
        }
        .aviso-vazio {
            font-size: 14px;
            color: #7f8c8d;
            background: #f8f9fa;
            border: 1px solid #dcdfe6;
            padding: 16px 24px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 480px;
            font-weight: bold;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body>

    <div id="conteudo" style="width: 100%; display: flex; justify-content: center;"></div>

    <script>
        const TOKEN = '7IIBS4AieOeEcmfWNF35znNX7wqR6O5d';
        const TABLE_ID = '1004';
        const COLUNA_NOME_SETOR = 'setor-corespo'; 

        const urlParams = new URLSearchParams(window.location.search);
        let setorFiltro = urlParams.get('setor') || urlParams.get('id') || urlParams.get('nome');

        if (!setorFiltro || setorFiltro.includes('{{') || setorFiltro.trim() === '') {
            setorFiltro = null;
        } else {
            setorFiltro = setorFiltro.trim().toLowerCase();
        }

        function extrairValor(val) {
            if (Array.isArray(val)) {
                if (val.length === 0) return 0;
                return val[0].value !== undefined ? val[0].value : (val[0].name !== undefined ? val[0].name : val[0]);
            }
            if (val !== null && typeof val === 'object') {
                return val.value !== undefined ? val.value : (val.name !== undefined ? val.name : 0);
            }
            return val;
        }

        async function carregarSetorIndividual() {
            const container = document.getElementById('conteudo');

            if (!setorFiltro) {
                container.innerHTML = '';
                return;
            }

            try {
                const url = `http://baserow.app.local/api/database/rows/table/${TABLE_ID}/?user_field_names=true&size=200`;
                
                const resposta = await fetch(url, {
                    method: 'GET',
                    headers: { 'Authorization': `Token ${TOKEN}` }
                });
                
                if (!resposta.ok) throw new Error(`Erro de Ligação: ${resposta.status}`);

                const dados = await resposta.json();
                const atribuicoes = dados.results;

                if (!atribuicoes || atribuicoes.length === 0) return;

                let setoresMap = {};

                atribuicoes.forEach((atribuicao) => {
                    if (!atribuicao) return;
                    
                    let chaves = Object.keys(atribuicao);
                    let chaveCategoria = chaves.find(k => k.toLowerCase().includes('atividade setorial')) || 'Atividade Setorial';
                    let chaveStatus = chaves.find(k => k.toLowerCase().includes('completa')) || 'Atividade completa';
                    let chaveSetor = chaves.find(k => k.toLowerCase() === COLUNA_NOME_SETOR.toLowerCase()) || COLUNA_NOME_SETOR;

                    let ehSetorial = Number(extrairValor(atribuicao[chaveCategoria])) || 0;
                    if (ehSetorial !== 1) return;

                    let valSetor = atribuicao[chaveSetor];
                    let nomeSetor = "Sem Setor";
                    let idSetor = null;

                    if (valSetor !== undefined && valSetor !== null) {
                        if (Array.isArray(valSetor) && valSetor.length > 0) {
                            nomeSetor = String(valSetor[0].value || valSetor[0].name || valSetor[0]);
                            idSetor = valSetor[0].id !== undefined ? String(valSetor[0].id) : null;
                        } else if (typeof valSetor === 'object') {
                            nomeSetor = String(valSetor.value || valSetor.name || valSetor);
                            idSetor = valSetor.id !== undefined ? String(valSetor.id) : null;
                        } else {
                            nomeSetor = String(valSetor);
                        }
                    }

                    if (nomeSetor === "Sem Setor" || nomeSetor === "0") return;

                    // TRUQUE: Se o ID da linha corresponder ao filtro numérico, transforma o filtro no nome exato!
                    if (idSetor === setorFiltro) {
                        setorFiltro = nomeSetor.toLowerCase();
                    }

                    if (!setoresMap[nomeSetor]) {
                        setoresMap[nomeSetor] = { soma: 0, total: 0 };
                    }

                    let statusConclusao = Number(extrairValor(atribuicao[chaveStatus])) || 0;
                    setoresMap[nomeSetor].soma += statusConclusao; 
                    setoresMap[nomeSetor].total++; 
                });

                let rankingArray = Object.keys(setoresMap).map(nome => {
                    let info = setoresMap[nome];
                    let media = info.total > 0 ? (info.soma / info.total) * 100 : 0;
                    return { 
                        nome: nome, 
                        nomeLower: nome.toLowerCase(),
                        percentagem: Math.round(media), 
                        total: info.total,
                        completas: info.soma 
                    };
                });

                rankingArray.sort((a, b) => b.percentagem - a.percentagem);

                let index = rankingArray.findIndex(s => s.nomeLower === setorFiltro || s.nomeLower.includes(setorFiltro));
                
                if (index === -1) {
                    container.innerHTML = `<div class="aviso-vazio">Sem atribuições setoriais cadastradas para o setor</div>`;
                    return;
                }

                let setorInfo = rankingArray[index];
                let posicaoOrdinal = `${index + 1}º`;

                container.innerHTML = `
                    <div class="card-container">
                        <div class="card-left">
                            <div class="setor-nome">${setorInfo.nome}</div>
                            <div class="posicao-texto">Posição no ranking de preenchimento: <span class="posicao-numero">${posicaoOrdinal}</span></div>
                        </div>
                        <div class="card-right">
                            <div class="mini-bar">
                                ${setorInfo.percentagem}%
                                <span class="tooltip-texto">Preenchidas: ${setorInfo.completas}/${setorInfo.total}</span>
                            </div>
                            <div class="total-atribuicoes">${setorInfo.total} atribuições</div>
                        </div>
                    </div>
                `;

            } catch (erro) {
                container.innerHTML = '';
            }
        }

        carregarSetorIndividual();
    </script>
</body>
</html>
